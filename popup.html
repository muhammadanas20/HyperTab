<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="assets/icons/icon32.png" />
  <title>HyprTab</title>
  <link rel="stylesheet" href="styles/popup.css" />
</head>
<body>
  <main class="pop">
    <header class="pop-header">
      <img src="assets/icons/icon48.png" width="34" height="34" alt="" class="pop-logo" />
      <div>
        <h1 class="pop-title">HyprTab</h1>
        <p class="pop-status" id="pop-status">…</p>
      </div>
    </header>

    <div class="pop-scene-card">
      <span class="pop-scene-label">Wallpaper</span>
      <span class="pop-scene-name" id="pop-scene">…</span>
    </div>

    <div id="pop-toggles" class="pop-toggles"></div>

    <footer class="pop-actions">
      <button id="pop-open-settings" class="btn">Open Settings</button>
      <button id="pop-newtab" class="btn btn-ghost">New Tab</button>
    </footer>
  </main>
  <script src="js/popup.js"></script>
</body>
</html>

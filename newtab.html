<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="assets/icons/icon32.png" />
  <title>New Tab</title>
  <link rel="stylesheet" href="styles/newtab.css" />
</head>
<body>
  <!-- animated wallpaper (scene engine) -->
  <canvas id="wallpaper" aria-hidden="true"></canvas>

  <!-- top bar: quick links left, widgets right -->
  <header id="topbar">
    <nav id="links" aria-label="Quick links"></nav>

    <section id="widgets" aria-label="Widgets">
      <div class="widget-cluster" id="clock-cluster">
        <div id="greeting" class="greeting" title="Greeting"></div>
        <div id="clock" class="clock" aria-label="Current time">--:--</div>
        <div id="date" class="date" aria-label="Current date"></div>
      </div>

      <div class="widget-cluster widget-cluster--row">
        <div id="weather" class="pill" hidden>
          <span id="weather-icon" class="pill-icon"></span>
          <span id="weather-temp" class="pill-strong"></span>
          <span class="pill-texts">
            <span id="weather-city"></span>
            <span id="weather-desc" class="pill-sub"></span>
          </span>
        </div>

        <div id="battery" class="pill" hidden>
          <svg id="battery-bolt" viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">
            <path d="M13 2 5 14h5l-1 8 8-12h-5z" fill="currentColor"/>
          </svg>
          <span id="battery-shell" class="battery-shell">
            <span id="battery-fill"></span>
          </span>
          <span id="battery-label" class="pill-strong"></span>
        </div>
      </div>
    </section>
  </header>

  <!-- centre stage -->
  <main id="center">
    <div id="search-wrap">
      <form id="search" role="search" autocomplete="off">
        <svg id="search-glyph" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="m16.5 16.5 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Search Google or type a URL"
          aria-label="Search Google or type a URL"
          spellcheck="false"
        />
        <kbd class="search-key" aria-hidden="true">/</kbd>
      </form>
      <div id="search-halo" aria-hidden="true"></div>
    </div>
  </main>

  <!-- living layer -->
  <canvas id="spider-canvas" aria-hidden="true"></canvas>
  <div id="bubble" class="bubble" role="status" aria-live="polite"></div>

  <p id="hint">press <kbd>/</kbd> to search · click near him — he dodges · double-click and he thwips</p>

  <button id="settings-gear" aria-label="Open settings" title="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M19.4 13.6l.1.9a2 2 0 0 1-.5 1.4l-.7.7a2 2 0 0 1-1.4.5l-.9-.1a6.7 6.7 0 0 1-1.4.9l-.4 1a2 2 0 0 1-1.9 1.1h-1a2 2 0 0 1-1.9-1.1l-.4-1a6.7 6.7 0 0 1-1.4-.9l-.9.1a2 2 0 0 1-1.4-.5l-.7-.7a2 2 0 0 1-.5-1.4l.1-.9c-.2-.5-.6-.9-.9-1.4l-1-.4a2 2 0 0 1-1.1-1.9v-1A2 2 0 0 1 4.9 8l1-.4c.3-.5.7-1 .9-1.4l-.1-.9A2 2 0 0 1 7.2 4l.7-.7a2 2 0 0 1 1.4-.5h.4l.5-.1c.5.2.9.6 1.4.9l1-.4A2 2 0 0 1 14.4 2l.4 1c.5.3 1 .7 1.4.9l.9-.1a2 2 0 0 1 1.4.5l.7.7a2 2 0 0 1 .5 1.4l-.1.9c.2.5.6.9.9 1.4l1 .4a2 2 0 0 1 1.1 1.9v1a2 2 0 0 1-1.1 1.9l-1 .4c-.3.5-.7 1-.9 1.4Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </button>

  <script src="lib/gsap.min.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
